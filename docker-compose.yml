version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: multi_tenant_ums-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: multi_tenant_ums
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multi_tenant_ums"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: multi_tenant_ums-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.17.0
    container_name: multi_tenant_ums-migrate
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgrespassword@postgres:5432/multi_tenant_ums?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi_tenant_ums-api
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://postgres:postgrespassword@postgres:5432/multi_tenant_ums?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "PU55wJ14YGEglg+uMBVjz80EW9Qn6DQDUSB6keV2XdA="
      JWT_KID: "v1"
      JWT_ISSUER: "multi_tenant_ums"
      JWT_AUDIENCE: "multi_tenant_ums-api"
      ACCESS_TTL: "15m"
      REFRESH_TTL: "168h"
      BCRYPT_COST: "12"
      PERM_CACHE_TTL: "5m"
      TENANT_CACHE_TTL: "30s"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

